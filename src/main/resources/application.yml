server:
  port: 8081

  servlet:
    session:
      timeout: 1800s  # 세션 소멸 시간 설정 : 초 단위 (1800초 = 30분)

spring:
  application:
    name: tasket

  thymeleaf:
    enable: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true

  datasource:
    url: jdbc:mysql://localhost:3306/tasket_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: tasket
    password: tasket0987

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        show-sql: true
        format-sql: true
    hibernate:
      ddl-auto: create

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  dir: ${IMAGES}