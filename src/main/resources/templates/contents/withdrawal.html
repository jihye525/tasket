<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MyPage</title>
    <link rel="stylesheet" href="/css/withdrawal.css"/>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="sidebar-logo">
            <a href="/">
                <img src="/image/tasket-logo-black.png" alt="로고 이미지"/>
            </a>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/mypage">회원정보 수정</a></li>
            <li><a href="#progress">달성률</a></li>
            <li><a href="/withdrawal">서비스 탈퇴</a></li>
        </ul>
    </div>

    <div class="withdrawal">
        <form action="/withdrawal" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <p>회원 탈퇴하기</p>
            <p class="input-group" id="profile-edit">
                <label for="userEmail">이메일</label>
                <input
                        type="email"
                        class="disabled-input"
                        id="userEmail"
                        name="email"
                        th:value="${user.email}"
                        readonly
                />
            </p>
            <button type="submit">회원 탈퇴하기</button>
        </form>
    </div>
</div>
</body>
</html>
